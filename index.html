<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>GateWorld - MindAR Prototype</title>


    <!-- A-Frame -->
    <script
        src="https://aframe.io/releases/1.6.0/aframe.min.js">
    </script>


    <!-- MindAR Image Tracking -->
    <script
        src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js">
    </script>


    <style>

        html,
        body
        {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                Arial,
                "Microsoft JhengHei",
                sans-serif;
        }


        #statusPanel
        {
            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 9999;

            padding: 12px 22px;

            border-radius: 12px;

            background: rgba(0, 0, 0, 0.70);

            color: white;

            font-size: 18px;

            text-align: center;

            pointer-events: none;
        }


        #statusPanel.found
        {
            background: rgba(0, 120, 70, 0.90);
        }


        #statusPanel.error
        {
            background: rgba(180, 30, 30, 0.90);
        }

    </style>

</head>


<body>


    <!-- 顯示目前 AR 狀態 -->

    <div id="statusPanel">

        正在啟動攝影機……

    </div>



    <!--
        imageTargetSrc:
        指向我們剛才由 Compiler 產生的 targets.mind
    -->

    <a-scene

        id="arScene"

        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: true;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        embedded

    >


        <!-- AR Camera -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>



        <!--
            我們只有一張 Target Image
            所以 targetIndex = 0
        -->

        <a-entity

            id="gateTarget"

            mindar-image-target="targetIndex: 0"

        >


            <!--
                當圖片被辨識到時，
                這個綠色立方體會出現在圖片中央上方
            -->

            <a-box

                position="0 0 0.25"

                scale="0.35 0.35 0.35"

                color="#00FF88"

                animation="
                    property: rotation;
                    to: 0 360 0;
                    loop: true;
                    dur: 3000;
                    easing: linear;
                "

            >

            </a-box>


        </a-entity>


    </a-scene>



    <script>

        const scene =
            document.querySelector("#arScene");


        const gateTarget =
            document.querySelector("#gateTarget");


        const statusPanel =
            document.querySelector("#statusPanel");



        /*
         * MindAR 完成初始化
         */

        scene.addEventListener(
            "arReady",
            () =>
            {
                console.log(
                    "[MindAR] AR Ready"
                );


                statusPanel.textContent =
                    "請將攝影機對準指定卡片";
            }
        );



        /*
         * MindAR 發生錯誤
         */

        scene.addEventListener(
            "arError",
            (event) =>
            {
                console.error(
                    "[MindAR] AR Error",
                    event
                );


                statusPanel.textContent =
                    "無法啟動 AR，請確認攝影機權限";

                statusPanel.classList.add(
                    "error"
                );
            }
        );



        /*
         * 成功辨識 Target Image
         */

        gateTarget.addEventListener(
            "targetFound",
            () =>
            {
                console.log(
                    "[MindAR] Target Found"
                );


                statusPanel.textContent =
                    "辨識成功！ACCESS GRANTED";

                statusPanel.classList.remove(
                    "error"
                );

                statusPanel.classList.add(
                    "found"
                );
            }
        );



        /*
         * Target Image 離開攝影機
         */

        gateTarget.addEventListener(
            "targetLost",
            () =>
            {
                console.log(
                    "[MindAR] Target Lost"
                );


                statusPanel.textContent =
                    "圖片已離開畫面，請重新掃描";

                statusPanel.classList.remove(
                    "found"
                );
            }
        );


    </script>


</body>

</html>
