<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>GateWorld - MindAR Prototype</title>


    <!-- A-Frame -->
    <script
        src="https://aframe.io/releases/1.6.0/aframe.min.js">
    </script>


    <!-- MindAR Image Tracking -->
    <script
        src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js">
    </script>


    <style>

        html,
        body
        {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                Arial,
                "Microsoft JhengHei",
                sans-serif;
        }


        #statusPanel
        {
            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 9999;

            padding: 12px 22px;

            border-radius: 12px;

            background: rgba(0, 0, 0, 0.70);

            color: white;

            font-size: 18px;

            text-align: center;

            pointer-events: none;
        }


        #statusPanel.found
        {
            background: rgba(0, 120, 70, 0.90);
        }


        #statusPanel.error
        {
            background: rgba(180, 30, 30, 0.90);
        }

    </style>

</head>


<body>


    <!-- 顯示目前 AR 狀態 -->

    <div id="statusPanel">

        正在啟動攝影機……

    </div>



    <!--
        imageTargetSrc:
        指向我們剛才由 Compiler 產生的 targets.mind
    -->

    <a-scene

        id="arScene"

        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: true;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        embedded

    >


        <!-- AR Camera -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>



        <!--
            我們只有一張 Target Image
            所以 targetIndex = 0
        -->

        <a-entity

            id="gateTarget"

            mindar-image-target="targetIndex: 0"

        >


            <!--
                當圖片被辨識到時，
                這個綠色立方體會出現在圖片中央上方
            -->

            <a-box

                position="0 0 0.25"

                scale="0.35 0.35 0.35"

                color="#00FF88"

                animation="
                    property: rotation;
                    to: 0 360 0;
                    loop: true;
                    dur: 3000;
                    easing: linear;
                "

            >

            </a-box>


        </a-entity>


    </a-scene>


   <script>

    /*
     * --------------------------------------------------------
     * NeppuLand WebAR Gate
     * --------------------------------------------------------
     */


    const scene =
        document.querySelector("#arScene");


    const gateTarget =
        document.querySelector("#gateTarget");


    const statusPanel =
        document.querySelector("#statusPanel");


    /*
     * 防止 Target Found 重複觸發。
     *
     * 一旦 Gate 已經開始開啟，
     * 就不再接受新的 targetFound / targetLost。
     */
    let gateOpening = false;



    /*
     * --------------------------------------------------------
     * MindAR 初始化完成
     * --------------------------------------------------------
     */

    scene.addEventListener(
        "arReady",
        () =>
        {
            console.log(
                "[MindAR] AR Ready"
            );


            statusPanel.textContent =
                "請將攝影機對準指定卡片";
        }
    );



    /*
     * --------------------------------------------------------
     * MindAR 初始化錯誤
     * --------------------------------------------------------
     */

    scene.addEventListener(
        "arError",
        (event) =>
        {
            console.error(
                "[MindAR] AR Error",
                event
            );


            statusPanel.textContent =
                "無法啟動 AR，請確認攝影機權限";


            statusPanel.classList.remove(
                "found"
            );


            statusPanel.classList.add(
                "error"
            );
        }
    );



    /*
     * --------------------------------------------------------
     * 產生 Prototype Gate Token
     * --------------------------------------------------------
     *
     * 現在只是 Prototype。
     *
     * 未來我們會把這裡改成：
     *
     * WebAR
     * ↓
     * ASP.NET Core Server
     * ↓
     * Server 簽發真正 Gate Token
     *
     * 現階段先由 Browser 產生 UUID。
     */

    function createGateToken()
    {
        if (
            window.crypto &&
            typeof window.crypto.randomUUID === "function"
        )
        {
            return window.crypto.randomUUID();
        }


        /*
         * 舊瀏覽器備援。
         *
         * Prototype 用即可，
         * 不當作真正安全 Token。
         */
        return (
            Date.now().toString(36) +
            "-" +
            Math.random().toString(36).substring(2)
        );
    }



    /*
     * --------------------------------------------------------
     * 成功辨識 Target Image
     * --------------------------------------------------------
     */

    gateTarget.addEventListener(
        "targetFound",
        () =>
        {
            /*
             * 已經開門的話，
             * 不允許再次觸發。
             */
            if (gateOpening)
            {
                return;
            }


            gateOpening = true;


            console.log(
                "[MindAR] Target Found"
            );


            /*
             * 顯示成功訊息
             */
            statusPanel.textContent =
                "辨識成功！ACCESS GRANTED";


            statusPanel.classList.remove(
                "error"
            );


            statusPanel.classList.add(
                "found"
            );



            /*
             * 建立 Gate Token
             */
            const gateToken =
                createGateToken();


            console.log(
                "[Gate] Generated Token:",
                gateToken
            );



            /*
             * 先讓 ACCESS GRANTED
             * 顯示 1.2 秒。
             *
             * 然後：
             *
             * 1. 停止 MindAR
             * 2. 釋放 Camera
             * 3. 建立 Unity URL
             * 4. 把 Gate Token 加進網址
             * 5. 跳轉到 Unity
             */

            setTimeout(
                async () =>
                {
                    /*
                     * -------------------------
                     * 停止 MindAR
                     * -------------------------
                     */

                    try
                    {
                        const arSystem =
                            scene.systems[
                                "mindar-image-system"
                            ];


                        if (arSystem)
                        {
                            await Promise.resolve(
                                arSystem.stop()
                            );


                            console.log(
                                "[MindAR] AR stopped"
                            );
                        }
                    }
                    catch (error)
                    {
                        /*
                         * 即使停止 Camera 失敗，
                         * 還是繼續進 Unity。
                         */

                        console.warn(
                            "[MindAR] Failed to stop AR:",
                            error
                        );
                    }



                    /*
                     * -------------------------
                     * 建立 Unity World URL
                     * -------------------------
                     *
                     * 目前網頁：
                     *
                     * https://ghiblirider2.github.io/
                     * NeppuLand-prototype/
                     *
                     * ./world/
                     *
                     * 會自動得到：
                     *
                     * https://ghiblirider2.github.io/
                     * NeppuLand-prototype/world/
                     */

                    const worldURL =
                        new URL(
                            "./world/",
                            window.location.href
                        );



                    /*
                     * 加入 Gate Token
                     *
                     * 結果：
                     *
                     * /world/
                     * ?gateToken=xxxxxxxx
                     */

                    worldURL.searchParams.set(
                        "gateToken",
                        gateToken
                    );



                    console.log(
                        "[Gate] Entering NeppuLand:",
                        worldURL.toString()
                    );



                    /*
                     * -------------------------
                     * 正式進入 Unity
                     * -------------------------
                     */

                    window.location.href =
                        worldURL.toString();
                },

                1200
            );
        }
    );



    /*
     * --------------------------------------------------------
     * Target Image 離開攝影機
     * --------------------------------------------------------
     */

    gateTarget.addEventListener(
        "targetLost",
        () =>
        {
            /*
             * Gate 已經開啟之後，
             * 不要再改畫面。
             */
            if (gateOpening)
            {
                return;
            }


            console.log(
                "[MindAR] Target Lost"
            );


            statusPanel.textContent =
                "圖片已離開畫面，請重新掃描";


            statusPanel.classList.remove(
                "found"
            );
        }
    );


</script>


</body>

</html>
