<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>NEPPU LAND</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!--
        ========================================================
        Unity Web Canvas
        ========================================================
    -->

    <canvas
        id="unity-canvas"
        tabindex="-1">
    </canvas>



    <!--
        ========================================================
        NeppuLand Loading Screen
        ========================================================
    -->

    <div id="loading-screen">


        <div id="loading-content">


            <!-- 品牌名稱 -->

            <div id="brand">

                NEPPU LAND

            </div>



            <!-- 簡單的 Gate 動畫 -->

            <div
                id="gate-symbol"
                aria-hidden="true">

                <div class="gate-diamond"></div>

            </div>



            <!-- Loading 狀態 -->

            <div id="loading-message">

                正在前往另一個世界……

            </div>



            <!-- Progress Bar -->

            <div
                id="progress-track"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
            >

                <div id="progress-fill"></div>

            </div>



            <!-- 百分比 -->

            <div id="progress-percent">

                0%

            </div>



            <!-- 次要訊息 -->

            <div id="loading-subtext">

                CONNECTING

            </div>


        </div>


    </div>



    <script>

        /*
         * =====================================================
         * NeppuLand Web Bootstrap
         * =====================================================
         */


        const canvas =
            document.querySelector(
                "#unity-canvas"
            );


        const loadingScreen =
            document.querySelector(
                "#loading-screen"
            );


        const loadingMessage =
            document.querySelector(
                "#loading-message"
            );


        const progressTrack =
            document.querySelector(
                "#progress-track"
            );


        const progressFill =
            document.querySelector(
                "#progress-fill"
            );


        const progressPercent =
            document.querySelector(
                "#progress-percent"
            );



        /*
         * -----------------------------------------------------
         * Unity Build 路徑
         * -----------------------------------------------------
         */

        const buildUrl =
            "Build";


        const loaderUrl =
            buildUrl +
            "/world.loader.js";



        /*
         * -----------------------------------------------------
         * Unity Build Configuration
         *
         * 下方的 Unity Template 變數
 	 * 會在 Build 時由 Unity 自動替換。
         * -----------------------------------------------------
         */

        const config =
        {
            dataUrl:
                buildUrl +
                "/world.data.unityweb",

            frameworkUrl:
                buildUrl +
                "/world.framework.js.unityweb",

            codeUrl:
                buildUrl +
                "/world.wasm.unityweb",





            streamingAssetsUrl:
                "StreamingAssets",

            companyName:
                "ghiblirider",

            productName:
                "NeppuLand",

            productVersion:
                "0.1.0",
        };



        /*
         * -----------------------------------------------------
         * 讓 Canvas 配合目前裝置尺寸
         * -----------------------------------------------------
         */

        function resizeCanvas()
        {
            canvas.style.width =
                "100%";

            canvas.style.height =
                "100%";
        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );



        /*
         * -----------------------------------------------------
         * 載入 Unity Loader
         * -----------------------------------------------------
         */

        const script =
            document.createElement(
                "script"
            );


        script.src =
            loaderUrl;



        /*
         * -----------------------------------------------------
         * Loader 下載完成
         * -----------------------------------------------------
         */

        script.onload =
            () =>
            {

                loadingMessage.textContent =
                    "正在載入 NeppuLand……";


                createUnityInstance(
                    canvas,
                    config,

                    /*
                     * -----------------------------------------
                     * Loading Progress
                     *
                     * progress：
                     * 0.0 ～ 1.0
                     * -----------------------------------------
                     */

                    (progress) =>
                    {
                        const percent =
                            Math.round(
                                progress * 100
                            );


                        progressFill.style.width =
                            percent + "%";


                        progressPercent.textContent =
                            percent + "%";


                        progressTrack.setAttribute(
                            "aria-valuenow",
                            percent
                        );


                        /*
                         * 依階段改變提示文字
                         */

                        if (percent < 25)
                        {
                            loadingMessage.textContent =
                                "正在建立連線……";
                        }
                        else if (percent < 60)
                        {
                            loadingMessage.textContent =
                                "正在前往另一個世界……";
                        }
                        else if (percent < 90)
                        {
                            loadingMessage.textContent =
                                "正在準備 NeppuLand……";
                        }
                        else
                        {
                            loadingMessage.textContent =
                                "即將抵達……";
                        }
                    }
                )


                /*
                 * -----------------------------------------
                 * Unity 初始化完成
                 * -----------------------------------------
                 */

                .then(
                    (unityInstance) =>
                    {
                        console.log(
                            "[NeppuLand] Runtime ready."
                        );


                        progressFill.style.width =
                            "100%";


                        progressPercent.textContent =
                            "100%";


                        loadingMessage.textContent =
                            "WELCOME TO NEPPU LAND";


                        /*
                         * 先讓 Unity Canvas 顯示。
                         */

                        canvas.classList.add(
                            "ready"
                        );


                        /*
                         * Loading Screen 淡出。
                         */

                        setTimeout(
                            () =>
                            {
                                loadingScreen.classList.add(
                                    "hide"
                                );
                            },

                            250
                        );


                        /*
                         * 淡出動畫完成後，
                         * 完全移除 Loading Screen。
                         */

                        setTimeout(
                            () =>
                            {
                                loadingScreen.style.display =
                                    "none";
                            },

                            1000
                        );
                    }
                )


                /*
                 * -----------------------------------------
                 * Unity 啟動失敗
                 * -----------------------------------------
                 */

                .catch(
                    (error) =>
                    {
                        console.error(
                            "[NeppuLand] Startup failed:",
                            error
                        );


                        loadingMessage.textContent =
                            "NeppuLand 載入失敗";


                        progressPercent.textContent =
                            "請重新整理頁面";


                        progressFill.classList.add(
                            "error"
                        );
                    }
                );
            };



        /*
         * -----------------------------------------------------
         * Loader 本身下載失敗
         * -----------------------------------------------------
         */

        script.onerror =
            () =>
            {
                loadingMessage.textContent =
                    "無法連線至 NeppuLand";


                progressPercent.textContent =
                    "請稍後再試";
            };



        document.body.appendChild(
            script
        );


    </script>


</body>

</html>
